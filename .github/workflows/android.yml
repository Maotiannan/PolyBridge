name: Android
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline noise evaluation adapter
        run: |
          python -m pip install -r evaluation/noise/requirements.txt
          python -m unittest discover -s evaluation/noise -p 'test_*.py'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
      - name: Verify and build
        run: ./gradlew :core:test :provider:qwen:test :evaluation:qwen:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Allow the runner to use its Android VM
        run: sudo chown "$(id -u)" /dev/kvm
      - name: Verify Android navigation, voice controls and media
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.testArchive=true -Pandroid.testInstrumentationRunnerArguments.testDuplex=true -Pandroid.testInstrumentationRunnerArguments.inputInteractions=true
      - uses: actions/upload-artifact@v4
        with:
          name: polybridge-debug
          path: app/build/outputs/apk/debug/*.apk
